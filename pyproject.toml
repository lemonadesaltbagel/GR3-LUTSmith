[project]
name = "gr3-lutsmith"
version = "1.0.0"
description = "Put the look of a .cube LUT into a RICOH GR III (firmware 2.10) or GR IIIx (firmware 1.60)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# Only for --photo, --icon and preview (reading DNG files, pictures, writing the preview sheet)
photo = [
    "rawpy>=0.18",
    "pillow>=9",
]

[tool.uv]
package = false
